<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lisp REPL</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font-family: ui-monospace, Consolas, monospace; background: #1e1e1e; color: #d4d4d4; display: flex; flex-direction: column; height: 100vh; }
  header { padding: .6rem 1rem; background: #252526; border-bottom: 1px solid #3c3c3c; display: flex; align-items: center; gap: .75rem; }
  header h1 { font-size: 1rem; margin: 0; font-weight: 600; }
  header button { background: #3c3c3c; color: #d4d4d4; border: 1px solid #555; border-radius: 4px; padding: .25rem .6rem; cursor: pointer; }
  header button:hover { background: #4a4a4a; }
  #log { flex: 1; overflow-y: auto; padding: 1rem; white-space: pre-wrap; word-break: break-word; }
  .entry { margin-bottom: .6rem; }
  .prompt { color: #6a9955; }
  .output { color: #9cdcfe; }
  .result { color: #d4d4d4; }
  .error { color: #f14c4c; }
  form { display: flex; border-top: 1px solid #3c3c3c; padding: .6rem 1rem; gap: .5rem; }
  #code { flex: 1; background: #2d2d2d; color: #d4d4d4; border: 1px solid #555; border-radius: 4px; padding: .5rem; font-family: inherit; font-size: .95rem; }
  button[type=submit] { background: #0e639c; color: white; border: none; border-radius: 4px; padding: .5rem 1rem; cursor: pointer; }
  button[type=submit]:hover { background: #1177bb; }
</style>
</head>
<body>
  <header>
    <h1>Lisp REPL</h1>
    <button id="reset">Reset session</button>
  </header>
  <div id="log"></div>
  <form id="form">
    <input id="code" autocomplete="off" placeholder="(+ 1 2)" autofocus />
    <button type="submit">Eval</button>
  </form>
  <script>
    let sessionId = localStorage.getItem("lisp-session-id") || null;
    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const code = document.getElementById("code");

    function append(className, text) {
      const div = document.createElement("div");
      div.className = "entry " + className;
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const expr = code.value.trim();
      if (!expr) return;
      append("prompt", "> " + expr);
      code.value = "";

      try {
        const res = await fetch("/api/eval", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sessionId, code: expr }),
        });
        const data = await res.json();
        sessionId = data.sessionId;
        localStorage.setItem("lisp-session-id", sessionId);

        if (data.output) append("output", data.output.replace(/\n$/, ""));
        if (data.error) append("error", "error: " + data.error);
        else if (data.result !== null && data.result !== undefined) append("result", data.result);
      } catch (err) {
        append("error", "request failed: " + err);
      }
    });

    document.getElementById("reset").addEventListener("click", async () => {
      const res = await fetch("/api/reset", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessionId }),
      });
      const data = await res.json();
      sessionId = data.sessionId;
      localStorage.setItem("lisp-session-id", sessionId);
      log.innerHTML = "";
      append("output", "session reset");
    });
  </script>
</body>
</html>
